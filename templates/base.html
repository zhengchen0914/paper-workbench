<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}论文工坊{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="mark">坊</span>论文工坊<span class="tag">v{{ version }}</span></a>
    <nav class="nav">
      <a href="/" class="{{ 'on' if active=='dashboard' else '' }}">看板</a>
      <a href="/radar" class="{{ 'on' if active=='radar' else '' }}">雷达</a>
      <a href="/boards" class="{{ 'on' if active=='boards' else '' }}">榜单</a>
      <a href="/inbox" class="{{ 'on' if active=='inbox' else '' }}">选题池</a>
      <a href="/library" class="{{ 'on' if active=='library' else '' }}">论文库</a>
      <a href="/drafts" class="{{ 'on' if active=='drafts' else '' }}">稿件</a>
      <a href="/knowledge" class="{{ 'on' if active=='knowledge' else '' }}">知识库</a>
      <a href="/graph" class="{{ 'on' if active=='graph' else '' }}">图谱</a>
      <a href="/settings" class="{{ 'on' if active=='settings' else '' }}">设置</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
<footer class="foot">本地运行 · 数据只保存在这台机器 · v{{ version }}</footer>
<script>
// 导出成功时横幅里带着绝对路径；给个一键复制，省得手选。
// 有些环境（后台/无桌面会话）explorer 弹不出来，路径就是最后的兜底。
document.querySelectorAll('.banner').forEach((box) => {
  const match = (box.textContent || '').match(/[A-Za-z]:\\[^\n]*?\.(?:md|zip|html|png|jpg)/);
  if (!match) return;
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'btn tiny ghost';
  button.textContent = '复制路径';
  button.style.marginLeft = '10px';
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(match[0]);
      button.textContent = '已复制';
    } catch (err) {
      button.textContent = '复制失败';
    }
    setTimeout(() => { button.textContent = '复制路径'; }, 1600);
  });
  box.appendChild(button);
});
</script>
</body>
</html>
